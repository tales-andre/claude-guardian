# Valores padrão do chart claude-guardian.
#
# Instalação típica em EKS com RDS:
#   helm install guardian deploy/helm/claude-guardian \
#     --set database.url="postgres://user:pass@meu-rds:5432/guardian" \
#     --set auth.dashboardToken="$(openssl rand -hex 24)" \
#     --set auth.agentKey="$(openssl rand -hex 24)" \
#     --set ingress.enabled=true \
#     --set ingress.host=guardian.minhaempresa.com

# IMPORTANTE: mantenha 1. O audit é um hash-chain SEQUENCIAL (cada entrada
# encadeia no hash da anterior) — dois ou mais writers concorrentes contra o
# mesmo Postgres corromperiam a cadeia. O volume de escrita do central é baixo
# (só espelho de incidentes/heartbeats), então 1 réplica é suficiente. HA real
# exigiria um lock por-append (ex.: SELECT ... FOR UPDATE na última linha).
replicaCount: 1

image:
  # Em EKS a imagem precisa estar num registry que o cluster puxe — normalmente
  # ECR. Faça o build e push (ver docs/EKS-DEPLOY.md) e aponte aqui, ex.:
  #   repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/claude-guardian
  #   tag: "1.0.0"
  # "latest" + sem registry (default abaixo) NÃO puxa em EKS — é só placeholder.
  repository: claude-guardian
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ── Banco de dados ─────────────────────────────────────────────────────────────
# Em produção use um Postgres gerenciado (RDS/Aurora). Informe a URL aqui OU
# referencie um Secret já existente (recomendado para não versionar credencial).
database:
  # postgres://user:senha@host:5432/guardian
  url: ""
  # Secret existente contendo a chave abaixo (tem precedência sobre .url)
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# ── Autenticação ───────────────────────────────────────────────────────────────
auth:
  # Token do dashboard (admin). Obrigatório se existingSecret vazio.
  dashboardToken: ""
  # Chave compartilhada dos agentes (hooks nas máquinas dos devs).
  agentKey: ""
  # Secret existente com as chaves GUARDIAN_DASHBOARD_TOKEN e GUARDIAN_AGENT_KEY
  existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: alb
  host: guardian.example.com
  path: /
  pathType: Prefix
  tls: []
  # Exemplo para AWS Load Balancer Controller (EKS).
  # scheme: `internal` (default, mais seguro) expõe só dentro da VPC/VPN — use
  # se os agentes (máquinas dos devs) alcançam o central pela rede interna.
  # Troque para `internet-facing` SE os agentes vivem fora da VPC (ex.: laptops
  # sem VPN) — senão eles não conseguem espelhar incidentes para o central.
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Variáveis de ambiente extras (ex.: GUARDIAN_PORT)
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Para IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::...

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
