{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-guardian.fullname" . }}-auth
  labels:
    {{- include "claude-guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  GUARDIAN_DASHBOARD_TOKEN: {{ required "auth.dashboardToken é obrigatório (ou use auth.existingSecret)" .Values.auth.dashboardToken | quote }}
  GUARDIAN_AGENT_KEY: {{ required "auth.agentKey é obrigatório (ou use auth.existingSecret)" .Values.auth.agentKey | quote }}
  {{- with .Values.auth.enrollmentSecret }}
  GUARDIAN_ENROLLMENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-guardian.fullname" . }}-db
  labels:
    {{- include "claude-guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
